<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where He At</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { height: 100%; width: 100%; background: #1a1a2e; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
  <script>
    const GIST_URL = 'https://gist.githubusercontent.com/Abaab/33030e7d70b5d5ba4e64aa440c771e6a/raw/data.txt';

    // Qualitative color palette
    const COLORS = [
      '#8ae0e0', '#b88ace', '#f5e88a', '#8a9de0', '#f5b88a',
      '#8fcf8f', '#e88a9e', '#8ad6e8', '#e88ad6', '#c8f0f0',
      '#bf7a7a', '#7ac4c4', '#c4a87a', '#f5eda0', '#7abfbf'
    ];

    function hashToColor(hash) {
      let sum = 0;
      for (let i = 0; i < hash.length; i++) sum += hash.charCodeAt(i);
      return COLORS[sum % COLORS.length];
    }

    async function init() {
      const map = L.map('map').setView([0, 0], 2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
      }).addTo(map);

      const res = await fetch(GIST_URL);
      const text = await res.text();
      const lines = text.trim().split('\n');

      const cellUsers = new Map();
      const cellDates = new Map();
      const trail = [];
      let latestEpoch = -Infinity;
      let latestCell = null;
      for (const line of lines) {
        const parts = line.split(' ');
        if (parts.length !== 3) continue;
        const [epoch, h3Cell, userHash] = parts;
        if (!h3.isValidCell(h3Cell)) continue;
        const ts = Number(epoch);
        if (!cellUsers.has(h3Cell)) cellUsers.set(h3Cell, new Set());
        cellUsers.get(h3Cell).add(userHash);
        if (!cellDates.has(h3Cell)) cellDates.set(h3Cell, []);
        cellDates.get(h3Cell).push(ts);
        trail.push(h3.cellToLatLng(h3Cell));
        if (ts > latestEpoch) {
          latestEpoch = ts;
          latestCell = h3Cell;
        }
      }

      const bounds = [];
      for (const [h3Cell, users] of cellUsers) {
        const boundary = h3.cellToBoundary(h3Cell);
        const latLngs = boundary.map(([lat, lng]) => [lat, lng]);
        bounds.push(...latLngs);

        // Use first user's color for the cell
        const color = hashToColor([...users][0]);
        const dayTimestamps = [...new Set(
          cellDates.get(h3Cell).map(ts => {
            const d = new Date(ts);
            return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
          })
        )].sort((a, b) => a - b);

        const DAY = 86400000;
        const ranges = [];
        let start = dayTimestamps[0], end = start;
        for (let i = 1; i < dayTimestamps.length; i++) {
          if (dayTimestamps[i] - end <= DAY) {
            end = dayTimestamps[i];
          } else {
            ranges.push([start, end]);
            start = end = dayTimestamps[i];
          }
        }
        ranges.push([start, end]);

        const fmtOpts = { year: 'numeric', month: 'short', day: 'numeric' };
        const fmtDay = { month: 'short', day: 'numeric' };
        const uniqueDates = ranges.map(([s, e]) => {
          const sd = new Date(s), ed = new Date(e);
          if (s === e) return sd.toLocaleDateString('en-US', fmtOpts);
          if (sd.getMonth() === ed.getMonth() && sd.getFullYear() === ed.getFullYear())
            return `${sd.toLocaleDateString('en-US', fmtDay)} - ${ed.getDate()}, ${ed.getFullYear()}`;
          return `${sd.toLocaleDateString('en-US', fmtOpts)} - ${ed.toLocaleDateString('en-US', fmtOpts)}`;
        });

        L.polygon(latLngs, {
          color: color,
          fillColor: color,
          fillOpacity: 0.6,
          weight: 3
        }).addTo(map)
          .bindTooltip(uniqueDates.join('<br>'), { sticky: true })
          .bindPopup(`Cell: ${h3Cell}<br>Users: ${[...users].join(', ')}`);
      }

      if (trail.length > 1) {
        L.polyline(trail, { color: '#ccc', weight: 2, opacity: 0.15 }).addTo(map);
      }

      if (latestCell) {
        const latestBoundary = h3.cellToBoundary(latestCell);
        map.fitBounds(latestBoundary.map(([lat, lng]) => [lat, lng]));
      } else if (bounds.length) {
        map.fitBounds(bounds);
      }
    }

    init();
  </script>
</body>
</html>
